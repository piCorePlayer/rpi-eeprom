name: Test pCP Release Pipeline

on:
  pull_request:
    branches: [ 'pCP' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-release-pipeline:
    if: github.event_name == 'pull_request' && github.base_ref == 'pCP' || github.event_name == 'workflow_dispatch' && github.ref_name == 'pCP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Test release pipeline
        env:
          PCP_RELEASE_TEST_VERBOSE: '1'
        run: python3 -m unittest discover -s test -p 'test_release_pipeline.py'
