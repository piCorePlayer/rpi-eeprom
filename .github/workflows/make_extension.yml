name: Release Extension

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing pCP release tag to package or resume
        required: true
        type: string

jobs:
  release:
    if: github.repository == 'piCorePlayer/rpi-eeprom' && github.ref_name == 'pCP'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pcp-eeprom-release
      cancel-in-progress: false
    steps:
      - name: Checkout pCP
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: pCP
          fetch-depth: 0

      - name: Package and publish tag
        env:
          GH_TOKEN: ${{ secrets.RPI_EEPROM_RELEASE }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bash .github/scripts/package-release.sh "$RELEASE_TAG"
