name: Merge and Release Upstream Tags

on:
  workflow_call:
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'piCorePlayer/rpi-eeprom' && github.ref_name == 'pCP'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: pcp-eeprom-release
      cancel-in-progress: false
    steps:
      - name: Checkout pCP
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
        with:
          ref: pCP
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Process upstream releases
        env:
          GH_TOKEN: ${{ secrets.RPI_EEPROM_RELEASE }}
        run: bash .github/scripts/check-upstream-releases.sh
